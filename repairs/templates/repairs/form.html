{% extends "main/layout.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container-fluid mt-3">
  <div class="row">
    <div class="col-sm-12">
      <div class="card">
        <div class="card-header">
          <i class="fa fa-list"> {{legend|upper}}</i>
        </div>
        <div class="card-body">
          <form method="POST">
            {% csrf_token %}
            <div class="card shadow-lg pt-1 border-success rounded">
                <div class="card-header">{{ legend|upper }}</div>
                <div class="card-body">
                    {% crispy form %}
                </div> <!--end card-body-->
            </div> <!--end card-->
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
(function(){
  // Filtra lista ekipamentu tuir kliente ne'ebé hili (Customer and Equipment Data)
  var $c = $('#id_customer'), $e = $('#id_equipment');
  if (!$c.length || !$e.length) return;
  var all = $e.find('option').clone();
  function filter(){
    var cid = $c.val(), cur = $e.val();
    $e.empty();
    all.each(function(){
      var d = $(this).attr('data-customer');
      if (!this.value || !cid || d === cid) $e.append($(this).clone());
    });
    if ($e.find('option[value="'+cur+'"]').length) $e.val(cur); else $e.val('');
  }
  $c.on('change', filter); filter();
})();
</script>
{% endblock %}
